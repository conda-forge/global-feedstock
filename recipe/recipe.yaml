context:
  version: "6.7"

package:
  name: global
  version: ${{ version }}

source:
  url: https://ftp.gnu.org/gnu/global/global-${{ version }}.tar.gz
  sha256: fdab590c9bda2d68d55e99c51c7e60c2c8595ae4dcebab9bbbb0795f2a5c8bf7

build:
  number: 0
  skip: win

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib('c') }}
    - make
  host:
    - libtool
    - ncurses
    - sqlite
  run:
    - libltdl
    - universal-ctags

tests:
  - script:
      - global --help

about:
  license: GPL-3.0-or-later
  license_file: LICENSE
  summary: Source code tag system
  homepage: https://www.gnu.org/software/global
  repository: https://www.gnu.org/software/global

extra:
  recipe-maintainers:
    - danielnachun
